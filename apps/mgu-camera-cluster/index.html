<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MGU Front Camera Cluster</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cluster-container">
        <div class="cluster-screen">
            <!-- Live video stream container for the vehicle's hardware camera feed -->
            <div class="central-viewport">
                <video id="clusterCameraFeed" autoplay playsinline muted style="width: 100%; height: 100%; object-fit: cover;"></video>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
