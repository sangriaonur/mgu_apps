<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW MGU Live Cluster Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="cluster-container">
        <div class="cluster-header">
            <div class="m-badge">M</div>
            <div class="model-text">Live Cluster Pro</div>
        </div>
        <div class="cluster-screen">
            <div class="dial left-dial"></div>
            <div class="central-viewport">
                <!-- ADAS View -->
                <div class="adas-view" id="adasView">
                    <div class="ego-vehicle"></div>
                </div>
                <!-- Camera Stream View -->
                <div class="camera-stream-view" id="cameraView">
                    <div class="simulated-feed">
                        <div class="camera-overlay-text">FRONT CAMERA FEED</div>
                    </div>
                </div>
            </div>
            <div class="dial right-dial"></div>
        </div>
        <div class="cluster-footer">
            <span class="range">🔋 699 km</span>
            <span class="time">12:08</span>
            <span class="temp">+21.0 °C</span>
        </div>
    </div>

    <div class="control-panel">
        <button class="demo-btn" id="toggleBtn" onclick="toggleView()">Toggle Front Camera Demo</button>
    </div>

    <script>
        function toggleView() {
            const adas = document.getElementById('adasView');
            const camera = document.getElementById('cameraView');
            const btn = document.getElementById('toggleBtn');
            
            if (camera.style.display === 'block') {
                camera.style.display = 'none';
                adas.style.display = 'flex';
                btn.textContent = 'Toggle Front Camera Demo';
                btn.classList.remove('active');
            } else {
                camera.style.display = 'block';
                adas.style.display = 'none';
                btn.textContent = 'Hide Front Camera Feed';
                btn.classList.add('active');
            }
        }
    </script>
</body>
</html>
